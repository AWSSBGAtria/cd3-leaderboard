# nginx site for the CD3 Leaderboard Hub (as deployed on EC2).
# Install:  sudo cp cd3.conf /etc/nginx/conf.d/cd3.conf && sudo nginx -t && sudo systemctl reload nginx
# TLS is then attached with:  sudo certbot --nginx -d cd3.awsatria.tech
# (certbot rewrites this file in place to add the 443 block + redirect.)
server {
    listen 80;
    server_name cd3.awsatria.tech;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
